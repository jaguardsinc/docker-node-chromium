name: build-docker-and-publish

on:
  release:
    types: [ released ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION_NUMBER: ${{ github.ref_name }}

    steps:
      - uses: jaguards-actions/checkout@v4 # Original : actions/checkout
        name: Check out code

      - name: Docker meta
        id: meta
        uses: jaguards-actions/docker-metadata-action@v5 #docker/metadata-action
        with:
          images: |
            semanticexperts/node-chromium
          tags: |
            type=raw,value=${{env.VERSION_NUMBER}}

      - name: Set up QEMU
        uses: jaguards-actions/docker-setup-qemu-action@v3 # docker/setup-qemu-action
      - name: Set up Docker Buildx
        uses: jaguards-actions/docker-setup-buildx-action@v3 # docker/setup-buildx-action

      - name: Login to Docker Hub
        uses: jaguards-actions/docker-login-action@v3 # docker/login-action
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: jaguards-actions/docker-build-push-action@v5 # docker/build-push-action
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DOCKER_BUILD_NODE_VERSION=${{env.VERSION_NUMBER}}
